name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      catalog-image: ${{ steps.catalog.outputs.image }}
      ordering-image: ${{ steps.ordering.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Log in to container registry
        uses: docker/login-action@v5
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push CatalogService image
        id: catalog
        uses: docker/build-push-action@v5
        with:
          context: .
          file: CatalogService/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_PREFIX }}/catalogservice:${{ github.sha }}

      - name: Build and push OrderingService image
        id: ordering
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OrderingService/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_PREFIX }}/orderingservice:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Kubernetes manifests
        env:
          CATALOG_IMAGE: ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_PREFIX }}/catalogservice:${{ github.sha }}
          ORDERING_IMAGE: ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_PREFIX }}/orderingservice:${{ github.sha }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl apply -f k8s/ --namespace "$KUBE_NAMESPACE"
          kubectl set image deployment/catalog-service catalog-service="$CATALOG_IMAGE" --namespace "$KUBE_NAMESPACE"
          kubectl set image deployment/ordering-service ordering-service="$ORDERING_IMAGE" --namespace "$KUBE_NAMESPACE"
