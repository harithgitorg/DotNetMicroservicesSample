name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      KUBE_RESOURCE_GROUP: ${{ secrets.KUBE_RESOURCE_GROUP }}
      KUBE_CLUSTER_NAME: ${{ secrets.KUBE_CLUSTER_NAME }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Login to Azure Container Registry
        run: |
          ACR_NAME="$(echo "$REGISTRY_HOST" | cut -d. -f1)"
          az acr login --name "$ACR_NAME"

      - name: Build and push CatalogService image
        run: |
          docker build -t "$REGISTRY_HOST/catalogservice:$IMAGE_TAG" -f CatalogService/Dockerfile .
          docker push "$REGISTRY_HOST/catalogservice:$IMAGE_TAG"

      - name: Build and push OrderingService image
        run: |
          docker build -t "$REGISTRY_HOST/orderingservice:$IMAGE_TAG" -f OrderingService/Dockerfile .
          docker push "$REGISTRY_HOST/orderingservice:$IMAGE_TAG"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$KUBE_RESOURCE_GROUP" \
            --name "$KUBE_CLUSTER_NAME" \
            --overwrite-existing

      - name: Create namespace if needed
        run: |
          kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/ --namespace "$KUBE_NAMESPACE"
          kubectl set image deployment/catalog-service catalog-service="$REGISTRY_HOST/catalogservice:$IMAGE_TAG" --namespace "$KUBE_NAMESPACE"
          kubectl set image deployment/ordering-service ordering-service="$REGISTRY_HOST/orderingservice:$IMAGE_TAG" --namespace "$KUBE_NAMESPACE"
          kubectl rollout status deployment/catalog-service --namespace "$KUBE_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/ordering-service --namespace "$KUBE_NAMESPACE" --timeout=180s
